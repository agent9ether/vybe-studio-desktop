appId: app.vybestudio.desktop
productName: Vybe Studio
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: engine
    to: engine
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!.venv/**"
asarUnpack:
  - "**/*.node"
win:
  target: [nsis]
  icon: public/favicon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.music
linux:
  target: [AppImage]
  category: Audio
